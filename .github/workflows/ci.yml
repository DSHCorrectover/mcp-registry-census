name: census-verify

on:
  push:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      # 数据锁：MANIFEST 逐文件 sha256 校验（外部 clone 即可验证数据未被篡改）
      - name: Verify manifest (data lock)
        run: |
          n=0; bad=0
          while read -r h f; do
            [ -f "$f" ] || { echo "MISSING $f"; bad=$((bad+1)); continue; }
            echo "$h  $f" | sha256sum -c - || bad=$((bad+1))
            n=$((n+1))
          done < MANIFEST.sha256
          echo "checked=$n bad=$bad"
          [ "$bad" -eq 0 ]
      # 复现自检：T0 汇总独立重算对账（9+9 复检口径）
      - name: Reproduce T0 (recompute + Wilson CI cross-check)
        run: python3 tools/verify.py
      # 复现自检：从 batch 卷宗独立重出 T0（merge-t0 幂等）
      - name: Reproduce merge (idempotent recompute)
        run: python3 tools/merge-t0.py
